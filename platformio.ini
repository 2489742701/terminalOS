; PlatformIO 工程配置 - ESP32-4848S040 极客多功能终端
; 硬件: ESP32-S3-WROOM-1 (16MB Flash + 8MB Octal PSRAM)
;       4.0" 480x480 RGB IPS (ST7701S) + GT911 触摸

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@^6.0.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_build.partitions = partitions_16MB.csv
board_build.arduino.memory_type = qspi_opi  ; Flash QSPI + PSRAM Octal

; 串口
upload_port = COM7
monitor_port = COM7
monitor_filters = esp32_exception_decoder, time

; 第三方库（厂商验证过的版本，放在 Libraries 目录）
lib_extra_dirs =
  ${PROJECTSRC}/../../4.0inch_ESP32-4848S040/1-Demo/Demo_Arduino/Libraries

; 编译选项
build_flags =
  -DBOARD_HAS_PSRAM
  ; PSRAM 8MB Octal
  -DCONFIG_SPIRAM_USE_MALLOC=1
  -DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
  ; LVGL 配置路径
  -I ${PROJECTSRC}/config
  ; CPU 频率
  -DF_CPU=240000000L
  ; 调试
  -DCORE_DEBUG_LEVEL=1
  ; 颜色优化
  -DLV_COLOR_16_SWAP=0

lib_deps =
  adafruit/Adafruit BusIO@^1.11.0