; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32s3
build_dir = .wb_build

[env]
platform = espressif32@^6.0.0
framework = arduino
monitor_speed = 115200
; 115200 而非 921600：本机 USB 线接触不良，高速握手经常掉线（ports 消失/Error 31）。
; 低速虽然慢一点，但成功率显著更高。
upload_speed = 115200

[env:esp32s3]
board = esp32-s3-devkitc-1
; 板级配置（血泪教训，勿改）：
;  · flash_mode 必须 dio（qio 在这块板必死）
;  · memory_type 必须 qio_opi（板载 8MB OPI PSRAM）
;  · 不要加 board_build.flash_size = 16MB / partitions_16MB.csv！
;    本工程编译出的二级 bootloader 只认 8MB flash；一旦配 16MB 分区表，
;    bootloader 读分区表发现分区越界 → 进入 while(1) fatal 死循环 →
;    被 RTC 看门狗不停复位（rst:0x3，无任何 panic 输出，极具迷惑性）。
;    已用极简工程二分验证：默认 8MB 分区 + dio + qio_opi 可正常启动。
board_build.flash_mode = dio
board_build.arduino.memory_type = qio_opi
upload_port = COM7
monitor_port = COM7
monitor_filters = esp32_exception_decoder, time
build_src_filter = +<*> -<browser_engine/lexbor/benchmarks/> -<browser_engine/lexbor/examples/> -<browser_engine/lexbor/test/> -<browser_engine/lexbor/utils/> -<browser_engine/lexbor/wasm/> -<browser_engine/lexbor/packaging/> -<browser_engine/lexbor/source/lexbor/ports/windows_nt/> -<browser_engine/lexbor/source/lexbor/selectors/> -<browser_engine/lexbor/source/lexbor/style/> -<browser_engine/lexbor/source/lexbor/unicode/> -<browser_engine/lexbor/source/lexbor/punycode/> -<browser_engine/lexbor/source/lexbor/engine/> -<browser_engine/lexbor/source/lexbor/url/>

lib_extra_dirs = 
	${PROJECT_DIR}/../4.0inch_ESP32-4848S040/1-Demo/Demo_Arduino/Libraries
lib_ignore = 
	Time
build_flags = 
	; loopTask 栈：默认只有 8192 B。ESP32-S3 上 App::loop() 里跑 LVGL +
	; 布局树渲染，UI 线程必须自己挖得起深度 —— 2026-09-23 实测打开乐鑫官网
	; 那一页直接 "A stack overflow in task loopTask has been detected" 重启。
	; 32KB 从内部 DRAM 出（开机后 DRAM 约有 250KB 富余，代价可接受）。
	-DARDUINO_LOOP_STACK_SIZE=32768
	-DBOARD_HAS_PSRAM
	-DCONFIG_SPIRAM_USE_MALLOC=1
	-DCONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP=1
	-DCONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=1
	-DF_CPU=240000000L
	-DCORE_DEBUG_LEVEL=1
	-DLV_COLOR_16_SWAP=0
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-D_GNU_SOURCE
	-Isrc/browser_engine/include
	-Isrc/browser_engine/lexbor/source
	-O2  ; PERF: LVGL 绘制热路径换速度（platform 默认 -Os）
lib_deps = 
	adafruit/Adafruit BusIO@^1.11.0
	tamctec/TAMC_GT911@^1.0.2
